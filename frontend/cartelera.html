<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax - Cartelera</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/iconos.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0a0a0a">
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="assets/logo.png" alt="CineMax">
            </div>
            <nav class="menu">
                <span class="menu-grupo">Operacion</span>
                <a href="dashboard.html" class="menu-item">Inicio</a>
                <a href="cartelera.html" class="menu-item activo">Cartelera</a>
                <a href="horarios.html" class="menu-item">Horarios</a>
                <a href="precios.html" class="menu-item">Precios</a>
                <a href="precios.html" class="menu-item">Dulceria</a>
                <span class="menu-grupo">Sistema</span>

                <a href="reportes.html" class="menu-item">Reportes</a>
                <a href="usuarios.html" class="menu-item">Usuarios</a>
            </nav>
            <div class="sidebar-abajo">
                <div class="sidebar-usuario">
                    <span class="avatar" id="avatarUsuario">AD</span>
                    <div class="usuario-datos">
                        <strong class="admin-nombre">Admin</strong>
                        <span id="rolUsuario">Administrador</span>
                    </div>
                </div>
                <a href="login.html" class="menu-item salir">Cerrar sesion</a>
            </div>
        </aside>

        <div class="contenido">

            <header class="topbar">
                <input type="text" class="buscador" placeholder="Buscar pelicula...">
                <div class="topbar-derecha">
                    <button class="btn-icono" title="Notificaciones"><i class="icono icono-campana"></i></button>
                    <div class="admin">
                        <span class="admin-punto"></span>
                        <span class="admin-rol">Administrador</span>
                    </div>
                </div>
            </header>

            <main class="principal">
                <h1>Gestion de Cartelera</h1>
                <p class="fecha">Agrega nuevas peliculas o revisa las existentes.</p>

                <div class="bloque" style="margin-bottom: 2rem;">
                    <h2 class="bloque-titulo">Agregar Nueva Pelicula</h2>

                    <form id="formPelicula" class="form-grid">
                        <div class="campo-form">
                            <label for="titulo">Titulo</label>
                            <input type="text" id="titulo" placeholder="Dune: Parte Dos" required>
                        </div>

                        <div class="campo-form">
                            <label for="genero">Genero</label>
                            <input type="text" id="genero" placeholder="Ciencia Ficcion" required>
                        </div>

                        <div class="campo-form">
                            <label for="duracion">Duracion (min)</label>
                            <input type="number" id="duracion" placeholder="166" min="1" required>
                        </div>

                        <div class="campo-form">
                            <label for="clasificacion">Clasificacion</label>
                            <input type="text" id="clasificacion" placeholder="ATP, +16, +18" required>
                        </div>

                        <div class="campo-form">
                            <label for="estado">Estado</label>
                            <select id="estado">
                                <option value="Cartelera">Cartelera</option>
                                <option value="Proximamente">Proximamente</option>
                            </select>
                        </div>

                        <button type="submit" class="btn-primario">Agregar</button>
                    </form>

                    <p class="mensaje" id="mensajeFormulario"></p>
                </div>

                <div class="bloque">
                    <h2 class="bloque-titulo">Peliculas en Sistema</h2>

                    <div class="tabla-scroll">
                        <table class="tabla">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Titulo</th>
                                    <th>Genero</th>
                                    <th>Duracion</th>
                                    <th>Clasificacion</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody id="tablaPeliculas"></tbody>
                        </table>
                    </div>
                </div>
            </main>

        </div>

    </div>

    <script src="js/sesion.js"></script>

    <script>
        const API = (location.port === '5000') ? '' : 'http://127.0.0.1:5000';

        function cargarPeliculas() {
            fetch(API + '/api/peliculas')
                .then(function (respuesta) {
                    return respuesta.json();
                })
                .then(function (peliculas) {
                    const tabla = document.getElementById('tablaPeliculas');
                    tabla.innerHTML = '';

                    for (let i = 0; i < peliculas.length; i++) {
                        const pelicula = peliculas[i];
                        let claseEstado = 'badge-info';

                        if (pelicula.estado === 'Cartelera') {
                            claseEstado = 'badge-ok';
                        }

                        tabla.innerHTML += '<tr>' +
                            '<td>' + pelicula.id + '</td>' +
                            '<td class="destacado">' + pelicula.titulo + '</td>' +
                            '<td>' + pelicula.genero + '</td>' +
                            '<td>' + pelicula.duracion + ' min</td>' +
                            '<td>' + pelicula.clasificacion + '</td>' +
                            '<td><span class="badge ' + claseEstado + '">' + pelicula.estado + '</span></td>' +
                            '</tr>';
                    }

                    if (peliculas.length === 0) {
                        tabla.innerHTML = '<tr><td class="tabla-vacia" colspan="6">No hay peliculas cargadas</td></tr>';
                    }
                })
                .catch(function () {
                    console.log('Error al cargar las peliculas');
                });
        }

        document.getElementById('formPelicula').addEventListener('submit', function (e) {
            e.preventDefault();

            const mensaje = document.getElementById('mensajeFormulario');

            const nuevaPelicula = {
                titulo: document.getElementById('titulo').value,
                genero: document.getElementById('genero').value,
                duracion: document.getElementById('duracion').value,
                clasificacion: document.getElementById('clasificacion').value,
                estado: document.getElementById('estado').value
            };

            fetch(API + '/api/peliculas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevaPelicula)
            })
                .then(function (respuesta) {
                    if (respuesta.ok) {
                        document.getElementById('formPelicula').reset();
                        mensaje.textContent = 'Pelicula agregada correctamente';
                        mensaje.className = 'mensaje ok';
                        cargarPeliculas();
                    } else {
                        mensaje.textContent = 'No se pudo agregar la pelicula';
                        mensaje.className = 'mensaje error';
                    }
                })
                .catch(function () {
                    mensaje.textContent = 'Error: el servidor no esta encendido';
                    mensaje.className = 'mensaje error';
                });
        });

        cargarPeliculas();
    </script>

</body>

</html>
