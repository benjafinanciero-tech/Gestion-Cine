<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax — Iniciar Sesión</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login">
        <!-- Lado izquierdo: formulario -->
        <section class="login__form-side">
            <div class="login__form-wrap">

                <header class="login__header">
                    <h1 class="login__title">Bienvenido</h1>
                    <p class="login__subtitle">Ingresá tus credenciales para acceder al sistema.</p>
                </header>

                <form class="login__form" action="#" method="POST">

                    <div class="field">
                        <label for="email" class="field__label">Email</label>
                        <input type="email" id="email" name="email" class="field__input" placeholder="Ingresá tu email" required autocomplete="email">
                    </div>

                    <div class="field">
                        <label for="password" class="field__label">Contraseña</label>
                        <input type="password" id="password" name="password" class="field__input" placeholder="••••••••••" required autocomplete="current-password">
                    </div>

                    <div class="form-row">
                        <label class="check">
              <input type="checkbox" name="remember" class="check__input">
              <span class="check__text">Recordarme</span>
            </label>
                        <a href="#" class="form-row__link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn--primary">Iniciar Sesión</button>

                    <button type="button" class="btn btn--ghost">
            <svg class="btn__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.76h3.56c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.76c-.99.66-2.25 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.11a6.6 6.6 0 0 1 0-4.22V7.05H2.18a11 11 0 0 0 0 9.9l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 0 0-9.82 6.05l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
            </svg>
            Iniciar sesión con Google
          </button>

                </form>

                <p class="login__footer">
                    ¿No tenés cuenta? <a href="#">Registrate gratis</a>
                </p>

            </div>
        </section>

        <!-- Lado derecho: ilustración -->
        <aside class="login__art-side" aria-hidden="true">
            <img src="assets/login.jpg" alt="" class="login__art-image" ">
        </aside>
    </main>

</body>

</html>
